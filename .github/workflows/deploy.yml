name: Deploy to GitHub Pages

# Build situs Astro lalu publikasikan ke GitHub Pages.
# Sumber deployment diset ke "GitHub Actions" (Settings → Pages → Source).
on:
  push:
    branches: [main]
  workflow_dispatch: # izinkan trigger manual dari tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Hanya satu deployment berjalan; yang menunggu tidak dibatalkan agar
# rilis yang dan selesai tidak terpotong.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` menjalankan `astro check && astro build`,
      # sehingga build gagal bila ada error TypeScript/Astro.
      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
